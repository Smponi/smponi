<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-label="Principles: quality is the moat, model-agnostic, own the stack"><title>Principles: quality is the moat, model-agnostic, own the stack</title>
<defs><clipPath id="card"><rect width="1200" height="352" rx="28"/></clipPath>
<radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 0) scale(520 260)"><stop offset="0" stop-color="#E8C38F" stop-opacity=".07"/><stop offset="1" stop-color="#E8C38F" stop-opacity="0"/></radialGradient></defs>
<style>@font-face{font-family:'PS Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PS Sans';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PS Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.s4{font-family:'PS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400}.s5{font-family:'PS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:500}.s6{font-family:'PS Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600}.sr{font-family:'PS Serif', 'Iowan Old Style', Georgia, serif;font-style:normal}.m4{font-family:'PS Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400}.m6{font-family:'PS Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:600}</style>
<g clip-path="url(#card)"><rect width="1200" height="352" fill="#0B0B0C"/><rect width="1200" height="352" fill="url(#g)"/>
<text x="64" y="72" class="m4" font-size="13.5" fill="#6E6E73" letter-spacing="2.4">HOW I WORK</text>
<text x="64" y="128" class="m4" font-size="14" fill="#E8C38F" letter-spacing="1">01</text><text x="63" y="174" class="s6" font-size="28" fill="#F5F5F7" letter-spacing="-0.6">Quality is the moat</text><text x="64" y="214" class="s4" font-size="18" fill="#A1A1A6" >Anyone can generate code now.</text><text x="64" y="242" class="s4" font-size="18" fill="#A1A1A6" >Tests, types, review and taste decide</text><text x="64" y="270" class="s4" font-size="18" fill="#A1A1A6" >what is worth shipping.</text><text x="442" y="128" class="m4" font-size="14" fill="#E8C38F" letter-spacing="1">02</text><text x="441" y="174" class="s6" font-size="28" fill="#F5F5F7" letter-spacing="-0.6">Model-agnostic</text><text x="442" y="214" class="s4" font-size="18" fill="#A1A1A6" >Loyal to results, not vendors. The</text><text x="442" y="242" class="s4" font-size="18" fill="#A1A1A6" >right model for each job, and a</text><text x="442" y="270" class="s4" font-size="18" fill="#A1A1A6" >second one to check it.</text><line x1="418.0" y1="112" x2="418.0" y2="308" stroke="#FFFFFF" stroke-opacity=".08"/><text x="820" y="128" class="m4" font-size="14" fill="#E8C38F" letter-spacing="1">03</text><text x="819" y="174" class="s6" font-size="28" fill="#F5F5F7" letter-spacing="-0.6">Own the stack</text><text x="820" y="214" class="s4" font-size="18" fill="#A1A1A6" >Neovim, tmux, Nix, a tuned Glove80</text><text x="820" y="242" class="s4" font-size="18" fill="#A1A1A6" >and my own IntelliJ plugins. If a tool</text><text x="820" y="270" class="s4" font-size="18" fill="#A1A1A6" >slows me down, I rebuild it.</text><line x1="796.0" y1="112" x2="796.0" y2="308" stroke="#FFFFFF" stroke-opacity=".08"/>
</g>
<rect x=".5" y=".5" width="1199" height="351" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>